<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
:root{
  --brand:#0b5fd6;
  --brand-dark:#084aa8;
  --bg:#f4f6fa;
  --panel:#ffffff;
  --line:#e3e7ee;
  --text:#1a2230;
  --muted:#5a6878;
  --ok:#1f9d55;
  --warn:#d97706;
  --bad:#c0392b;
  --shadow:0 1px 3px rgba(10,30,60,.06),0 4px 18px rgba(10,30,60,.05);
  --radius:10px;
  --safe-bottom: env(safe-area-inset-bottom);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button{font:inherit;cursor:pointer}
a{color:var(--brand);text-decoration:none}
input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=email],
input[type=tel],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,95,214,.15)}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:1px solid var(--line);
  background:#fff;border-radius:7px;color:var(--text);font-weight:500;transition:.15s}
.btn:hover{background:#f6f8fc}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:#eef1f6;color:var(--text)}
.btn.danger{color:var(--bad);border-color:#f3cfca}
.btn.danger:hover{background:#fdecea}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.full{width:100%;justify-content:center}

/* ============================================================
   Layout — 3-column Dashpivot-style: folders | subnav | main
   ============================================================ */
.app{display:grid;grid-template-columns:240px 220px 1fr;min-height:100vh}
@media (max-width:1100px){.app{grid-template-columns:230px 200px 1fr}}
@media (max-width:880px){.app{grid-template-columns:1fr}}

/* ---- Folders sidebar (left, WHITE) ---- */
.sidebar{background:#ffffff;color:var(--text);border-right:1px solid var(--line);
  position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
.sidebar .brand{display:flex;align-items:center;gap:8px;padding:14px 16px 12px}
.sidebar .brand .logo-bar{width:24px;height:24px;background:linear-gradient(135deg,#42a5f5,#1565c0);border-radius:4px;position:relative;flex-shrink:0}
.sidebar .brand .logo-bar::after{content:"";position:absolute;left:4px;top:13px;width:3px;height:7px;background:#fff;box-shadow:5px -3px 0 #fff, 10px -5px 0 #fff;border-radius:1px}
.sidebar .brand .wordmark{font-weight:700;color:#1a2a3e;font-size:18px;letter-spacing:-.2px}
.workspace-card{margin:0 12px 8px;padding:10px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:.15s}
.workspace-card:hover{background:#f6f8fc;border-color:#c8d3e3}
.workspace-card .ws-logo{width:32px;height:32px;background:#1565c0;border-radius:4px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
.workspace-card .ws-name{font-weight:600;font-size:13px;color:#1a2230;line-height:1.2}
.side-link{display:flex;align-items:center;gap:10px;padding:8px 16px;color:#3a455a;cursor:pointer;font-size:13.5px;border-left:3px solid transparent;transition:.12s}
.side-link:hover{background:#f5f8fc}
.side-link.active{background:#e3f0ff;color:#1565c0;border-left-color:#1565c0;font-weight:500}
.side-link .ic{width:18px;display:inline-flex;justify-content:center;color:#5a6878}
.side-link.active .ic{color:#1565c0}
.myday-cta{margin:10px 12px 4px;padding:12px 14px;border-radius:8px;background:linear-gradient(135deg,#0b5fd6,#1e88e5);color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:.12s;display:flex;flex-direction:column;gap:2px}
.myday-cta:hover{filter:brightness(1.06)}
.myday-cta.active{outline:2px solid #0b5fd6;outline-offset:2px}
.myday-cta .sub{font-weight:400;font-size:11px;opacity:.9}
.sidebar .search-box{margin:6px 12px 10px;position:relative}
.sidebar .search-box input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff}
.sidebar .search-box::before{content:"⌕";position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#9aa6b7;font-size:14px}
.side-section{padding:10px 16px 4px;color:#7d8aa1;text-transform:uppercase;font-size:10.5px;letter-spacing:.06em;font-weight:600}
.folder-tree{padding:0 6px;flex:1;overflow:auto}
.folder-tree .row{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:5px;cursor:pointer;color:#3a455a;font-size:13px}
.folder-tree .row:hover{background:#eef3f9;color:#1a2230}
.folder-tree .row.active{background:#e3f0ff;color:#1565c0;font-weight:500}
.folder-tree .row .ic{opacity:.7;font-size:13px}
.folder-tree .child{padding-left:22px;color:#5a6878;font-size:12.5px}
.archive-tabs{display:flex;gap:0;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
.archive-tabs button{flex:1;padding:10px;border:0;background:#fff;color:#5a6878;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.archive-tabs button.on{background:#1565c0;color:#fff}
.archive-tabs button:not(.on):hover{background:#f5f8fc}

/* ---- Secondary nav (middle column) ---- */
.subnav{background:#ffffff;border-right:1px solid var(--line);padding:14px 0 80px;position:sticky;top:0;height:100vh;overflow:auto}
.subnav-link{display:flex;align-items:center;gap:10px;padding:9px 18px;color:#3a455a;cursor:pointer;font-size:14px;border-left:3px solid transparent;transition:.12s}
.subnav-link:hover{background:#f5f8fc;color:#1a2230}
.subnav-link.active{background:#e3f0ff;color:#1565c0;border-left-color:#1565c0;font-weight:500}
.subnav-link .ic{width:20px;display:inline-flex;justify-content:center;color:#5a6878;font-size:16px}
.subnav-link.active .ic{color:#1565c0}
.subnav-link .badge{font-size:9.5px;background:#22c55e;color:#fff;padding:1px 6px;border-radius:8px;margin-left:auto;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.subnav .tabs-section{margin-top:18px}
.subnav-cat{padding:8px 18px;display:flex;align-items:center;gap:8px;cursor:pointer;color:#1a2230;font-size:13.5px;font-weight:500}
.subnav-cat:hover{background:#f5f8fc}
.subnav-cat .cat-icon{width:12px;height:12px;border-radius:2px;flex-shrink:0}
.subnav-cat .chev{margin-left:auto;color:#9aa6b7;font-size:10px;transition:transform .15s}
.subnav-cat.open .chev{transform:rotate(90deg)}
.subnav-tpl{display:flex;align-items:center;gap:8px;padding:6px 18px 6px 38px;color:#5a6878;cursor:pointer;font-size:12.5px}
.subnav-tpl:hover{background:#f5f8fc;color:#1565c0}
.subnav-tpl.active{background:#e3f0ff;color:#1565c0;font-weight:500}
.subnav-tpl .ic{color:#9aa6b7;font-size:11px}

/* ---- Mobile ---- */
.mobile-nav{display:none;position:sticky;top:0;background:#ffffff;color:#1a2230;padding:10px 14px;align-items:center;gap:10px;z-index:20;border-bottom:1px solid var(--line)}
.mobile-nav .logo-bar{width:24px;height:24px;background:linear-gradient(135deg,#42a5f5,#1565c0);border-radius:4px;flex-shrink:0}
.mobile-nav .name{font-weight:700;flex:1;color:#1a2a3e}
.mobile-nav .menu-btn{background:transparent;border:0;color:#1a2230;font-size:22px;padding:4px 8px;cursor:pointer}
@media (max-width:880px){
  .mobile-nav{display:flex}
  .sidebar,.subnav{position:fixed;left:-260px;transition:left .25s;z-index:50;width:260px;height:100vh}
  .sidebar.open{left:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .subnav{left:auto;right:-260px}
  .subnav.open{right:0;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
  .scrim.show{display:block}
}

/* Main */
.main{padding:18px 22px 90px;max-width:1500px}
@media (max-width:880px){.main{padding:14px 14px 90px}}
.crumbs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.crumbs span{color:#9aa6b7}
.crumbs .sep{color:#c2cad6}
h1.page-title{font-size:22px;margin:0 0 16px;font-weight:600}
h2.section-title{font-size:16px;margin:22px 0 10px;font-weight:600;color:#2a3445;display:flex;align-items:center;gap:8px}
h2.section-title .pill{font-size:11px;color:#fff;background:var(--brand);padding:2px 8px;border-radius:10px;font-weight:500}

/* Cards & tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:6px 0 14px}
.tabs .tab{padding:8px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-size:13.5px}
.tabs .tab:hover{color:var(--text)}
.tabs .tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:500}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 14px}
.toolbar .search{flex:1;min-width:160px;max-width:340px}
.toolbar .grow{flex:1}

/* Template grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;
  box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:.15s}
.card:hover{transform:translateY(-1px);box-shadow:0 2px 5px rgba(10,30,60,.08),0 8px 26px rgba(10,30,60,.08)}
.card .row{display:flex;align-items:center;justify-content:space-between}
.card .icn{width:34px;height:34px;border-radius:8px;background:#e9eef8;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:600}
.card .title{font-weight:600;color:#1a2230;font-size:15px}
.card .sub{color:var(--muted);font-size:12px}
.card .meta{color:var(--muted);font-size:11.5px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;display:flex;justify-content:space-between}

/* Kanban */
.kanban{display:flex;gap:12px;overflow:auto;padding-bottom:16px}
.k-col{min-width:240px;width:240px;background:#eef2f7;border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:75vh;overflow:auto}
.k-col h3{margin:0 0 4px;font-size:13px;color:#3a455a;display:flex;justify-content:space-between;align-items:center}
.k-col h3 .cnt{background:#fff;color:#3a455a;border-radius:10px;padding:1px 8px;font-size:11px;font-weight:500}
.k-card{background:#fff;border-radius:8px;padding:10px;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line)}
.k-card:hover{border-color:var(--brand)}
.k-card .title{font-weight:600;font-size:13px;margin-bottom:3px}
.k-card .sub{color:var(--muted);font-size:11.5px}
.k-card .tag{display:inline-block;background:#dce8fa;color:#0b5fd6;padding:1px 7px;border-radius:9px;font-size:10.5px;margin-top:6px}

/* Register / list */
.list{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;box-shadow:var(--shadow)}
.list table{width:100%;border-collapse:collapse;font-size:13px}
.list th{background:#f6f8fc;color:#3a455a;font-weight:600;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.list td{padding:10px 12px;border-bottom:1px solid #f0f3f8;vertical-align:top}
.list tr:hover{background:#f9fbfe;cursor:pointer}
.status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:500;background:#eef2f7;color:#3a455a}
.status.ok{background:#dff5e6;color:#1f7a3a}
.status.wait{background:#fff3d9;color:#a36a00}
.status.done{background:#e3ebff;color:#0b5fd6}
.status.bad{background:#fbe3e0;color:#c0392b}
.subnav-link .badge.bad{background:#c0392b}

/* Form */
.form-shell{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.form-header{background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;padding:16px 20px}
.form-header h1{margin:0;font-size:20px;font-weight:600}
.form-header .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;opacity:.92;margin-top:6px}
.form-body{padding:14px 20px 30px}
.form-section{border:1px solid var(--line);border-radius:10px;margin:14px 0;background:#fafbfd}
.form-section header{padding:10px 14px;background:#f0f4fa;border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;font-weight:600;color:#2a3445;display:flex;justify-content:space-between;align-items:center}
.form-section .body{padding:14px}
.field{margin:10px 0}
.field label{display:block;font-weight:500;margin-bottom:5px;color:#3a455a;font-size:13px}
.field .hint{color:var(--muted);font-size:12px;margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
@media (max-width:680px){.row2,.row3{grid-template-columns:1fr}}
.info-block{background:#fffbe7;border:1px solid #f1e1a0;color:#6a5a14;padding:10px 14px;border-radius:8px;font-size:13px;white-space:pre-line}
.notice{padding:10px 14px;border-radius:8px;font-size:13px;line-height:1.5}
.notice h3{font-size:13px;margin:0 0 4px}
.notice h3:last-child{margin-bottom:0}
.notice-warning{background:#fffbe7;border:1px solid #f1e1a0;color:#6a5a14}
.notice-danger{background:#fdecec;border:1px solid #f3b4b4;color:#8a1f1f}
.notice-info{background:#eaf2ff;border:1px solid #b9d3fb;color:#1f3a63}
.checklist{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:12.5px;cursor:pointer;user-select:none}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.percent-grid{display:grid;grid-template-columns:1fr 80px;gap:6px 10px;align-items:center;margin-top:8px}
.percent-grid input[type=number]{padding:6px 8px}
.photo-strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.photo{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f0f3f8;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:cover}
.photo .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:50%;width:20px;height:20px;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.add-photo{display:inline-flex;align-items:center;justify-content:center;width:96px;height:96px;border:1.5px dashed var(--line);border-radius:8px;color:var(--muted);cursor:pointer;font-size:24px;background:#fff}
.add-photo:hover{border-color:var(--brand);color:var(--brand)}
.add-photo input{display:none}

/* Signature */
.sig{border:1px solid var(--line);border-radius:8px;background:#fff;position:relative;touch-action:none}
.sig canvas{display:block;width:100%;height:140px;border-radius:8px;background:linear-gradient(transparent calc(100% - 25px),#dde3ec calc(100% - 25px),#dde3ec calc(100% - 24px),transparent calc(100% - 24px))}
.sig .controls{display:flex;justify-content:space-between;padding:6px 8px;border-top:1px solid var(--line);background:#f9fbfe;font-size:12px;color:var(--muted)}
.sig-locked{padding:14px;display:flex;align-items:center;justify-content:space-between;background:#f0f6ec;border:1px solid #c9e0bb;border-radius:8px}
.sig-locked img{max-height:50px}
.sig-locked .meta{font-size:12px;color:#3a4f29}

/* Footer action bar */
.action-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding-bottom:calc(10px + var(--safe-bottom))}

/* Dashboard */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.stat .num{font-size:24px;font-weight:600;color:var(--brand)}
.stat .lbl{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,40,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:14px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.modal header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal header h3{margin:0;font-size:16px}
.modal .body{padding:16px 18px}
.modal .foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:32px;background:#0d1b2a;color:#fff;padding:9px 16px;border-radius:18px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:200;opacity:0;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}

/* Print PDF */
@media print{
  .sidebar,.mobile-nav,.action-bar,.tabs,.toolbar,.btn{display:none !important}
  body{background:#fff}
  .form-shell{box-shadow:none;border:0}
  .form-section{break-inside:avoid}
}
</style>
<style>
/* ============================================================
   McKimm Field — app-specific styles (layered on top of the
   verbatim McKimm Pivot stylesheet above). Field is a single-
   column, mobile-first shell: no sidebar/subnav, so most of the
   copied desktop layout rules above simply go unused, which is
   harmless. Everything below is additive.
   ============================================================ */
:root{
  --brand:#1f9d55;
  --brand-dark:#167a41;
}
body{ background:var(--bg); }

.field-topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px; background:var(--brand); color:#fff;
  box-shadow:var(--shadow);
}
.field-topbar .menu-btn{
  background:rgba(255,255,255,.15); border:none; color:#fff;
  width:36px; height:36px; border-radius:8px; font-size:18px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.field-topbar .logo-bar{ display:none }
.field-topbar .wordmark{ font-weight:700; font-size:16px; flex:1 }
.field-topbar .user-chip{
  font-size:12px; background:rgba(255,255,255,.18); padding:5px 10px;
  border-radius:20px; max-width:130px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}

.field-main{ max-width:640px; margin:0 auto; padding:16px 14px 60px; }

/* Admin/Supervisor drawer — slides in from the right, reuses the
   .scrim element's on-screen behaviour but is Field's own markup
   (mckimm-core.js's openMobileMenu/closeMobileMenu never touch this). */
.admin-drawer{
  position:fixed; top:0; right:0; height:100%; width:290px; max-width:86vw;
  background:var(--panel); box-shadow:-6px 0 24px rgba(10,30,60,.18);
  transform:translateX(100%); transition:transform .22s ease; z-index:60;
  display:flex; flex-direction:column; overflow-y:auto;
}
.admin-drawer.open{ transform:translateX(0); }
.admin-drawer .drawer-head{
  padding:16px; background:var(--brand); color:#fff;
}
.admin-drawer .drawer-head .t{ font-weight:700; font-size:15px; }
.admin-drawer .drawer-head .s{ font-size:12px; opacity:.85; margin-top:2px; }
.admin-drawer .drawer-link{
  padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer;
  display:flex; align-items:center; gap:10px; color:var(--text); font-weight:500;
}
.admin-drawer .drawer-link .ic{ width:20px; text-align:center; opacity:.75 }
.admin-drawer .drawer-link:hover{ background:#f6f8fc }
.admin-drawer .drawer-link.active{ background:rgba(31,157,85,.1); color:var(--brand-dark); font-weight:700 }
.admin-drawer .drawer-section{
  padding:10px 16px 4px; font-size:11px; text-transform:uppercase; letter-spacing:.04em;
  color:var(--muted); font-weight:700;
}
#fieldScrim{
  position:fixed; inset:0; background:rgba(10,20,35,.4); z-index:55;
  opacity:0; pointer-events:none; transition:opacity .2s ease;
}
#fieldScrim.show{ opacity:1; pointer-events:auto; }

.op-card{ min-height:150px; display:flex; flex-direction:column; }
.op-card.op-disabled{ opacity:.6 }
.op-card .sub{ flex:1 }

@media (min-width:700px){
  .field-main .grid{ grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>

<!-- Dummy off-screen elements so mckimm-core.js's closeMobileMenu() (auto-
     called by nav() on narrow screens) has something harmless to touch.
     Field never opens these — it uses its own admin-drawer instead. -->
<div class="scrim" id="scrim" hidden></div>
<div id="sidebar" hidden></div>

<div class="field-topbar">
  <button class="menu-btn" onclick="toggleAdminDrawer()" aria-label="Admin / Supervisor menu">☰</button>
  <div class="wordmark">McKimm Field</div>
  <div class="user-chip" id="fieldUserChip"></div>
</div>

<div id="fieldScrim" onclick="closeAdminDrawer()"></div>
<aside class="admin-drawer" id="adminDrawer">
  <div class="drawer-head">
    <div class="t">Admin / Supervisor</div>
    <div class="s">Full access — all templates, all projects</div>
  </div>
  <div class="drawer-link" id="fieldHomeBtn" data-route="operatorhome" onclick="nav('operatorhome')"><span class="ic">🏠</span> Operator Home</div>
  <div class="drawer-section">Office / Admin</div>
  <div class="drawer-link" data-route="dashboard" onclick="nav('dashboard')"><span class="ic">⌂</span> Dashboard</div>
  <div class="drawer-link" data-route="templates" onclick="nav('templates')"><span class="ic">▤</span> Template Library</div>
  <div class="drawer-link" data-route="register" onclick="nav('register')"><span class="ic">📊</span> Analytics / Register</div>
  <div class="drawer-link" data-route="reminders" onclick="nav('reminders')"><span class="ic">⏰</span> Reminders</div>
  <div class="drawer-link" data-route="compliance" onclick="nav('compliance')"><span class="ic">✅</span> Compliance</div>
  <div class="drawer-link" data-route="photos" onclick="nav('photos')"><span class="ic">▣</span> Photos</div>
  <div class="drawer-link" data-route="users" onclick="nav('users')"><span class="ic">◍</span> Users</div>
  <div class="drawer-link" data-route="settings" onclick="nav('settings')"><span class="ic">⚙</span> Settings</div>
</aside>

<main class="field-main" id="main"></main>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<div class="toast" id="toast"></div>

<script src="mckimm-core.js"></script>
<script>
/* ============================================================
   McKimm Field — operator-facing shell.
   Loads the shared mckimm-core.js engine (same TEMPLATES array,
   same STATE/localStorage key "mckimm-pivot-v1" as McKimm Pivot,
   so forms started in one app show up in the other instantly).
   Adds one custom route, "operatorhome" (registered via
   window.CUSTOM_VIEWS — see mckimm-core.js header comment), plus
   a slide-in Admin/Supervisor drawer giving full, unrestricted
   access to every office view core already provides.
   ============================================================ */

/* ---------- Field-only state (lives inside the shared STATE object,
   so it round-trips through the same save()/localStorage as everything
   else — no core.js changes needed). ---------- */
STATE.fieldProject = STATE.fieldProject || "";

/* Daily Report is keyed per-project-per-day (project_location +
   report_date — it has no employee field), unlike Timesheet / Pre-Start
   which are per-person (see myDayFormFor() in mckimm-core.js). */
function dailyReportFormFor(project, date){
  return STATE.forms.find(f=>f.templateId==="MCK-Daily-Report" && f.data?.project_location===project && f.data?.report_date===date);
}

/* ---------- Admin/Supervisor drawer ---------- */
function toggleAdminDrawer(){
  document.getElementById("adminDrawer").classList.toggle("open");
  document.getElementById("fieldScrim").classList.toggle("show");
}
function closeAdminDrawer(){
  document.getElementById("adminDrawer").classList.remove("open");
  document.getElementById("fieldScrim").classList.remove("show");
}
function updateTopbar(){
  document.getElementById("fieldUserChip").textContent = STATE.currentUser || "";
  document.querySelectorAll("#adminDrawer [data-route]").forEach(l=>{
    l.classList.toggle("active", l.dataset.route===route.view);
  });
}

/* Wrap core's nav() so EVERY navigation — including ones baked straight
   into core-rendered HTML, e.g. the "Templates ›" breadcrumb's
   onclick="nav('templates')" inside renderForm()/renderTemplate() —
   also closes the drawer and refreshes the topbar, without editing
   mckimm-core.js itself. Safe because script tags run in document
   order: by the time this line runs, the top-level "function nav(){}"
   in mckimm-core.js has already created window.nav for us to capture. */
const _coreNav = nav;
window.nav = function(view, params={}){
  _coreNav(view, params);
  closeAdminDrawer();
  updateTopbar();
};

/* ---------- Operator Home ---------- */
function renderOperatorHome(m){
  const today = todayISO();
  const machine = MACHINERY.find(x=>x.id===STATE.myDayEquipment);

  const drForm = STATE.fieldProject ? dailyReportFormFor(STATE.fieldProject, today) : null;
  const tsForm = myDayFormFor("MCK-Daily-Timesheet", "employee", "ts_date");
  const psForm = machine ? myDayFormFor(machine.id, "operator", "inspection_date") : null;

  function opCard(icon, title, subtitle, existing, startAction, disabled){
    const statusHtml = existing
      ? `<span class="status ${existing.workflowColumn==="Approved"||existing.workflowColumn==="Submitted"?"done":"wait"}">${esc(existing.workflowColumn||"In progress")}</span>`
      : `<span class="status">Not started</span>`;
    const btnLabel = existing ? "Continue" : "Start";
    const btnAction = existing ? `nav('form',{id:'${existing.templateId}',formId:'${existing.id}'})` : (startAction||"");
    return `
      <div class="card op-card${disabled?" op-disabled":""}" style="cursor:default">
        <div class="row"><div class="icn">${icon}</div>${statusHtml}</div>
        <div class="title">${esc(title)}</div>
        <div class="sub">${esc(subtitle)}</div>
        <button class="btn primary" style="margin-top:10px;width:100%" ${disabled?"disabled":""} onclick="${btnAction}">${btnLabel}</button>
      </div>`;
  }

  m.innerHTML = `
    <h1 class="page-title">G'day, ${esc(STATE.currentUser)}</h1>
    <div class="notice notice-info" style="margin-bottom:16px">Photos taken inside any form below are stamped automatically with the date, time and your name — no extra step needed.</div>

    <div class="stat-grid" style="grid-template-columns:1fr">
      <div class="field" style="margin:0">
        <label>I am</label>
        <select onchange="STATE.currentUser=this.value; save(); render(); updateTopbar();">
          ${USERS.map(u=>`<option ${u===STATE.currentUser?"selected":""}>${esc(u)}</option>`).join("")}
        </select>
      </div>
    </div>
    <div class="stat-grid" style="grid-template-columns:1fr 1fr;margin-top:10px">
      <div class="field" style="margin:0">
        <label>Project / Location today</label>
        <select onchange="STATE.fieldProject=this.value; save(); render();">
          <option value="" ${!STATE.fieldProject?"selected":""}>Select a project…</option>
          ${PROJECT_LOCATIONS.map(p=>`<option ${p===STATE.fieldProject?"selected":""}>${esc(p)}</option>`).join("")}
        </select>
      </div>
      <div class="field" style="margin:0">
        <label>Equipment today</label>
        <select onchange="STATE.myDayEquipment=this.value; save(); render();">
          <option value="" ${!STATE.myDayEquipment?"selected":""}>No machinery / hand tools only</option>
          ${MACHINERY.map(x=>`<option value="${x.id}" ${x.id===STATE.myDayEquipment?"selected":""}>${esc(x.label)}</option>`).join("")}
        </select>
      </div>
    </div>

    <h2 class="section-title">Today — ${fmtDate(today)}</h2>
    <div class="grid">
      ${opCard("📋", "Daily Report", STATE.fieldProject?("For "+STATE.fieldProject):"Select a project above first", drForm,
        STATE.fieldProject?`startForm('MCK-Daily-Report',{project_location:'${esc(STATE.fieldProject)}', report_date:'${today}'})`:"", !STATE.fieldProject)}
      ${opCard("⏱", "Employee Timesheet", "Clock in/out self-photos, work breakdown, fatigue check", tsForm,
        `startForm('MCK-Daily-Timesheet',{employee:'${esc(STATE.currentUser)}', ts_date:'${today}'})`)}
      ${machine
        ? opCard("⚙", "Pre-Start Check — "+machine.label, "Required before operating this machine today", psForm,
            `startForm('${machine.id}',{operator:'${esc(STATE.currentUser)}', inspection_date:'${today}'})`)
        : `<div class="card op-card" style="cursor:default;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:24px">Select your equipment above if you're operating machinery today — a Pre-Start check will appear here.</div>`}
    </div>

    <h2 class="section-title">Need something else?</h2>
    <div class="notice">Tap <b>☰</b> above for the full Admin / Supervisor menu — every template, every project, dashboard, reminders, register and more.</div>
  `;
}
window.CUSTOM_VIEWS = { operatorhome: renderOperatorHome };

/* ---------- Boot ---------- */
const hash = location.hash.slice(1);
if (hash){
  const [view, id, formId] = hash.split("/");
  route = { view, params:{id, formId} };
} else {
  route = { view:"operatorhome", params:{} };
}
render();
updateTopbar();
</script>
</body>
</html>
